<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prank ❤️</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        button {
            padding: 18px 35px;
            font-size: 22px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
        }

        #surprise {
            display: none;
            font-size: 70px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <h1>❤️ Petit message ❤️</h1>

    <button onclick="surprise()">
        Clique ici 👆
    </button>

    <div id="surprise">🖕😂</div>

    <script>
        function surprise() {
            document.getElementById("surprise").style.display = "block";
        }
    </script>

</body>
</html>
