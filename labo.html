<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Login</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
    background:
        linear-gradient(rgba(0,255,200,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,200,.06) 1px, transparent 1px),
        #050505;
    background-size: 35px 35px;
}

.login {
    width: 360px;
    padding: 35px;
    border: 1px solid #00ffc8;
    border-radius: 15px;
    background: rgba(5,5,5,.94);
    box-shadow: 0 0 30px rgba(0,255,200,.15);
    text-align: center;
}

h1 {
    letter-spacing: 4px;
    margin-bottom: 8px;
}

.subtitle {
    color: #8d9997;
    font-size: 13px;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    border: 1px solid #333;
    border-radius: 7px;
    background: #0b0b0b;
    color: white;
    outline: none;
}

input:focus {
    border-color: #00ffc8;
    box-shadow: 0 0 10px rgba(0,255,200,.2);
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: none;
    border-radius: 7px;
    background: #00ffc8;
    color: #00100c;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    box-shadow: 0 0 20px rgba(0,255,200,.4);
}

#result {
    margin-top: 20px;
    color: #00ffc8;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="login">

    <h1>CYBER LOGIN</h1>

    <div class="subtitle">
        🔐 ENVIRONNEMENT DE DÉMONSTRATION
    </div>

    <form onsubmit="connexion(event)">

        <input
            id="user"
            type="text"
            placeholder="Identifiant"
            required
        >

        <input
            id="pass"
            type="password"
            placeholder="Mot de passe fictif"
            required
        >

        <button type="submit">
            SE CONNECTER
        </button>

    </form>

    <div id="result"></div>

</div>

<script>
function connexion(event) {
    event.preventDefault();

    const user = document.getElementById("user").value;

    document.getElementById("result").textContent =
        "✓ Connexion simulée pour : " + user;
}
</script>

</body>
</html>
