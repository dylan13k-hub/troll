<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Lab</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
            background:
                linear-gradient(rgba(0,255,200,.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,200,.06) 1px, transparent 1px),
                #050505;
            background-size: 35px 35px;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                repeating-linear-gradient(
                    0deg,
                    transparent 0px,
                    transparent 3px,
                    rgba(255,255,255,.025) 4px
                );
            pointer-events: none;
        }

        .box {
            width: 360px;
            padding: 35px;
            border: 1px solid rgba(0,255,200,.45);
            border-radius: 15px;
            background: rgba(5,5,5,.92);
            box-shadow:
                0 0 25px rgba(0,255,200,.15),
                inset 0 0 25px rgba(0,255,200,.04);
            text-align: center;
        }

        .title {
            font-size: 28px;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #8d9997;
            font-size: 13px;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: 1px solid #333;
            border-radius: 7px;
            background: #0b0b0b;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #00ffc8;
            box-shadow: 0 0 10px rgba(0,255,200,.2);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 7px;
            background: #00ffc8;
            color: #00100c;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            box-shadow: 0 0 20px rgba(0,255,200,.35);
        }

        #result {
            margin-top: 20px;
            font-size: 13px;
            color: #00ffc8;
        }

        .warning {
            margin-top: 22px;
            font-size: 11px;
            color: #666;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="title">CYBER LAB</div>

        <div class="subtitle">
            🔐 SIMULATION — ENVIRONNEMENT DE TEST
        </div>

        <input
            id="user"
            type="text"
            placeholder="Identifiant de test"
        >

        <input
            id="pass"
            type="password"
            placeholder="Mot de passe de test"
        >

        <button onclick="tester()">
            SE CONNECTER
        </button>

        <div id="result"></div>

        <div class="warning">
            ⚠️ Utiliser uniquement des identifiants fictifs.
        </div>

    </div>

    <script>
        function tester() {
            const user = document.getElementById("user").value;

            document.getElementById("result").textContent =
                "✓ Simulation effectuée pour : " + user;
        }
    </script>

</body>
</html>
